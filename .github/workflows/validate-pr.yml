name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TXT and EPUB import unit tests
        run: node --experimental-strip-types --test tests/unit/*.test.mjs
      - name: Strict ESLint verification
        run: npm run lint -- --max-warnings=0
      - name: Build static site
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
      - name: Assert output was exported
        run: test -f out/index.html

  database-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: access_policy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d access_policy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated database security policies
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/reading_chunks_v2_smoke.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: access_policy_test
