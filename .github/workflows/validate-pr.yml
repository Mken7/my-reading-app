name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Legacy lint audit (tracked separately)
        continue-on-error: true
        run: npm run lint
      - name: Build static site
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
      - name: Assert output was exported
        run: test -f out/index.html
